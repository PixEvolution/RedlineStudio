<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title">Games</h1>
    <p class="page-sub">Made by players, published in the Studio.</p>
    <div id="filter-mount"></div>
    <div id="games" class="games-grid">
      <p class="empty-note">Loading games…</p>
    </div>
  </main>

  <script type="module">
    import { renderNav, toast } from "./js/ui.js";
    import { listGames } from "./js/games.js";
    import { gameCard, resetLiveCardBudget } from "./js/cards.js";
    import { createFilterBar, applyFilter } from "./js/filterbar.js";

    renderNav("");

    const grid = document.getElementById("games");

    try {
      const games = await listGames();

      const render = (search, sort) => {
        grid.innerHTML = "";
        resetLiveCardBudget();
        const shown = applyFilter(games, search, sort, ["title", "owner", "description"]);
        if (shown.length === 0) {
          grid.innerHTML = games.length === 0
            ? `<p class="empty-note">No games published yet.<br>Be the first — open the Studio!</p>`
            : `<p class="empty-note">No games match that search.</p>`;
          return;
        }
        for (const g of shown) grid.appendChild(gameCard(g, { rootPath: "", showOwner: true }));
      };

      createFilterBar(document.getElementById("filter-mount"), {
        placeholder: "Search games…",
        sorts: [
          ["recent", "Most recent"],
          ["rated", "Top rated"],
          ["played", "Top played"],
          ["cheapest", "Cheapest"]
        ],
        onChange: render
      });
      render("", "recent");
    } catch (err) {
      grid.innerHTML = "";
      toast("Couldn't load games: " + err.message, true);
    }
  </script>
</body>
</html>
