<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Games</title>
  <meta name="description" content="A free game platform: build retro CRT-style games in your browser with blocks or code, publish them instantly, and play everyone else's — arcade coin slots, lines and all.">
  <link rel="canonical" href="https://redlinestudio.dev/">
  <meta property="og:site_name" content="RedlineStudio">
  <meta property="og:title" content="RedlineStudio — make and play retro browser games">
  <meta property="og:description" content="A free game platform: build retro CRT-style games in your browser with blocks or code, publish them instantly, and play everyone else's — arcade coin slots, lines and all.">
  <meta property="og:url" content="https://redlinestudio.dev/">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <script>(window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2208639648972390"
     crossorigin="anonymous"></script>
</head>
<body>
  <!-- TEMPORARY DEBUG: a load report on screen (phones have no console). -->
  <div id="dbg" style="position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;
    max-height:50vh;overflow:auto;background:#200;border:2px solid #e5322d;border-radius:10px;
    padding:10px;font:12px/1.4 monospace;color:#ffb3b0;white-space:pre-wrap;word-break:break-word">DEBUG — loading…\n</div>
  <script>
    window.dbg = function (m) { var b = document.getElementById("dbg"); b.textContent += m + "\n"; b.scrollTop = b.scrollHeight; };
    window.addEventListener("error", function (e) {
      dbg("⚠ " + ((e.target && e.target !== window && (e.target.src || e.target.href)) ? "FAILED TO LOAD " + (e.target.src || e.target.href)
          : (e.message + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""))));
    }, true);
    window.addEventListener("unhandledrejection", function (e) { var r = e.reason; dbg("⚠ PROMISE: " + (r && (r.message || r) )); });
    dbg("screen " + innerWidth + "x" + innerHeight + " · coarse=" + matchMedia("(pointer: coarse)").matches);
  </script>

  <main class="page">
    <h1 class="page-title">Games</h1>
    <p class="page-sub">Made by players, published in the Studio.</p>
    <div id="filter-mount"></div>
    <div id="room-top" class="room-nav"></div>
    <div id="games" class="games-grid">
      <p class="empty-note">Loading the arcade…</p>
    </div>
    <div id="room-bottom" class="room-nav"></div>
  </main>

  <script type="module">
    import { renderNav, toast } from "./js/ui.js";
    import { ROOM_SIZE } from "./js/games.js";
    import { gameCard, resetLiveCardBudget } from "./js/cards.js";
    import { createFilterBar, applyFilter } from "./js/filterbar.js";

    renderNav("");

    const grid = document.getElementById("games");

    // Search and sort rank the WHOLE arcade first; only then is the result
    // cut into rooms of 24. So "Top rated" puts a thumbs-down game at the
    // very end of the last room, behind every unrated one — never beside
    // the winners just because it's new.
    let all = [];                   // every public game, fetched once
    let shown = [];                 // after global search + sort
    let roomNum = 1;
    let search = "", sort = "rated";

    const rooms = () => Math.max(1, Math.ceil(shown.length / ROOM_SIZE));

    const render = () => {
      grid.innerHTML = "";
      resetLiveCardBudget();
      if (shown.length === 0) {
        grid.innerHTML = all.length === 0
          ? `<p class="empty-note">No games published yet.<br>Be the first — open the Studio!</p>`
          : `<p class="empty-note">No games match that search.</p>`;
        renderDoors();
        return;
      }
      const slice = shown.slice((roomNum - 1) * ROOM_SIZE, roomNum * ROOM_SIZE);
      for (const g of slice) grid.appendChild(gameCard(g, { rootPath: "", showOwner: true }));
      renderDoors();
    };

    const renderDoors = () => {
      const last = rooms();
      for (const mount of [document.getElementById("room-top"), document.getElementById("room-bottom")]) {
        mount.innerHTML = "";
        if (last <= 1) continue;                      // one room — no doors needed
        const prev = document.createElement("button");
        prev.className = "btn";
        prev.textContent = "◀ ROOM " + (roomNum - 1);
        prev.disabled = roomNum <= 1;
        prev.addEventListener("click", () => enterRoom(roomNum - 1));
        const label = document.createElement("span");
        label.className = "room-label";
        label.textContent = "ROOM " + roomNum + " / " + last;
        const next = document.createElement("button");
        next.className = "btn";
        next.textContent = "ROOM " + (roomNum + 1) + " ▶";
        next.disabled = roomNum >= last;
        next.addEventListener("click", () => enterRoom(roomNum + 1));
        mount.append(prev, label, next);
      }
    };

    function enterRoom(n) {
      roomNum = Math.max(1, Math.min(rooms(), n));
      render();
      if (n !== 1) window.scrollTo({ top: 0 });
    }

    const refilter = () => {
      shown = applyFilter(all, search, sort, ["title", "owner", "description"]);
      roomNum = 1;                  // a new ranking starts at the front door
      render();
    };

    createFilterBar(document.getElementById("filter-mount"), {
      placeholder: "Search all games…",
      sorts: [
        ["rated", "Top rated"],
        ["recent", "Most recent"],
        ["played", "Top played"],
        ["cheapest", "Cheapest"]
      ],
      onChange: (s, so) => { search = s; sort = so; refilter(); }
    });

    try {
      // ---- DEBUG: the same loop as listAllPublic(), timed batch by batch ----
      const { db } = await import("./js/firebase.js");
      const F = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const t0 = performance.now();
      dbg("firestore imported " + Math.round(performance.now() - t0) + "ms");
      const games = []; let cur = null, scanned = 0, total = 0, n = 0, kb = 0;
      do {
        const tb = performance.now();
        const q = cur
          ? F.query(F.collection(db, "games"), F.orderBy("createdAt", "desc"), F.startAfter(cur), F.limit(40))
          : F.query(F.collection(db, "games"), F.orderBy("createdAt", "desc"), F.limit(40));
        dbg("batch " + (++n) + " requested…");
        const snap = await F.getDocs(q);
        let bytes = 0;
        scanned = snap.docs.length; total += scanned;
        for (const d of snap.docs) {
          cur = d;
          const data = d.data();
          bytes += JSON.stringify(data).length;
          const g = { id: d.id, ...data };
          if (g.casino || g.unlisted) continue;
          games.push(g);
        }
        kb += bytes / 1024;
        dbg("batch " + n + ": " + scanned + " docs, " + Math.round(bytes / 1024) + " KB, " + Math.round(performance.now() - tb) + "ms");
      } while (scanned === 40 && total < 400);
      dbg("DONE: " + games.length + " games shown, " + Math.round(kb) + " KB total, " + Math.round(performance.now() - t0) + "ms");
      all = games;
      refilter();
      dbg("rendered room 1 OK");
    } catch (err) {
      grid.innerHTML = "";
      toast("Couldn't load games: " + err.message, true);
    }
  </script>
  <script type="module">import { footAd } from "./js/ads.js"; footAd();</script>
</body>
</html>
