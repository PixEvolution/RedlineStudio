<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Log in</title>
  <meta name="description" content="Log in or create a RedlineStudio account: username and password, nothing else.">
  <link rel="canonical" href="https://redlinestudio.dev/login.html">
  <meta property="og:site_name" content="RedlineStudio">
  <meta property="og:title" content="Log in — RedlineStudio">
  <meta property="og:description" content="Log in or create a RedlineStudio account: username and password, nothing else.">
  <meta property="og:url" content="https://redlinestudio.dev/login.html">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <script>(window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;</script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2208639648972390"
     crossorigin="anonymous"></script>
</head>
<body>
  <main class="page">
    <div class="panel auth-box">
      <div class="tabs">
        <div class="tab active" id="tab-login">Log in</div>
        <div class="tab" id="tab-create">Create account</div>
      </div>

      <form id="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" maxlength="60" autocomplete="off" spellcheck="false">
        <p class="hint">1–10 characters. Any character allowed. Caps matter.
        (Linked an email in Account settings? Log in with the email instead.)</p>

        <label for="password">Password</label>
        <input type="password" id="password" maxlength="10" autocomplete="off">
        <p class="hint">1–10 characters. Any character allowed. Caps matter.</p>

        <!-- creating an account = agreeing to the Terms: a box you must tick -->
        <label id="agree-row" style="display:none; font-weight:normal; margin-top:10px; cursor:pointer">
          <input type="checkbox" id="agree" style="width:auto; margin-right:6px; vertical-align:middle">
          I agree to the <a href="terms.html" target="_blank" style="color:#ff8f8c">Terms of Service</a> and
          have read the <a href="privacy.html" target="_blank" style="color:#ff8f8c">Privacy Policy</a>.
          <span class="hint" style="display:block; margin-top:4px">Under 18? Get a parent or guardian's okay first.
          Don't use your real name as your username.</span>
        </label>

        <br>
        <button class="btn" id="submit" type="submit" style="width:100%">Log in</button>
      </form>
      <p class="hint" style="margin-top:12px; text-align:center">
        <a href="#" id="forgot" style="color:#ff8f8c">Forgot password?</a> — works once an email is linked in ⚙ Account.
      </p>
      <p class="hint" style="text-align:center">
        <a href="terms.html" style="color:#ff8f8c">Terms of Service</a> ·
        <a href="privacy.html" style="color:#ff8f8c">Privacy Policy</a></p>
    </div>
  </main>

  <script type="module">
    import { renderNav, toast, $ } from "./js/ui.js";
    import { createAccount, login, currentUser, sendReset } from "./js/auth.js";

    renderNav("");
    if (currentUser()) window.location.href = "index.html";

    let mode = "login";
    const tabLogin = $("#tab-login");
    const tabCreate = $("#tab-create");
    const submit = $("#submit");

    function setMode(m) {
      mode = m;
      tabLogin.classList.toggle("active", m === "login");
      tabCreate.classList.toggle("active", m === "create");
      submit.textContent = m === "login" ? "Log in" : "Create account";
      $("#agree-row").style.display = m === "create" ? "block" : "none";
    }
    $("#forgot").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = prompt("The EMAIL linked to your account (no email linked = no recovery, by design):");
      if (email == null || !email.trim()) return;
      try {
        await sendReset(email);
        toast("If that email is on an account, a reset mail is on its way.");
      } catch (err) { toast(err.message, true); }
    });
    tabLogin.addEventListener("click", () => setMode("login"));
    tabCreate.addEventListener("click", () => setMode("create"));

    $("#auth-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = $("#username").value;
      const password = $("#password").value;
      if (mode === "create" && !$("#agree").checked) {
        toast("Tick the box to agree to the Terms of Service first.", true);
        return;
      }
      submit.disabled = true;
      try {
        if (mode === "create") {
          await createAccount(username, password);
          toast("Account created. Welcome, " + username + "!");
        } else {
          await login(username, password);
          toast("Welcome back, " + username + "!");
        }
        setTimeout(() => window.location.href = "index.html", 600);
      } catch (err) {
        toast(err.message, true);
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
