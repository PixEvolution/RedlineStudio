<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Play</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title" id="game-title">Loading…</h1>
    <p class="page-sub" id="game-meta"></p>

    <!-- The game player. Each engine version keeps its renderer forever,
         so old games always work as the studio evolves. -->
    <div class="game-frame" id="frame"></div>
  </main>

  <script type="module">
    import { renderNav, toast, fmtDate } from "./js/ui.js";
    import { getGame, countPlay } from "./js/games.js";
    import { Engine, CANVAS_W, CANVAS_H } from "./js/engine.js";
    import { createTouchControls, isTouchDevice } from "./js/touch-controls.js";
    import { attachFullscreenButton } from "./js/fullscreen.js";

    renderNav("");

    const frame = document.getElementById("frame");
    const titleEl = document.getElementById("game-title");
    const metaEl = document.getElementById("game-meta");

    const renderers = {
      // v0: the original "welcome message" games
      v0(game, mount) {
        const wrap = document.createElement("div");
        const msg = document.createElement("h2");
        msg.textContent = game.data?.message || "(This game has no content yet.)";
        const note = document.createElement("p");
        note.className = "hint";
        note.textContent = "Engine v0 — an early RedlineStudio game.";
        wrap.append(msg, note);
        mount.appendChild(wrap);
      },

      // v1: real scripted games on the CRT engine
      v1(game, mount) {
        mount.innerHTML = "";
        mount.style.display = "block";

        const stage = document.createElement("div");
        stage.className = "stage";
        const canvas = document.createElement("canvas");
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;
        canvas.className = "workspace-canvas";
        stage.appendChild(canvas);
        mount.appendChild(stage);

        const bar = document.createElement("div");
        bar.className = "stage-bar";
        const fsBtn = document.createElement("button");
        fsBtn.className = "btn btn-small btn-ghost";
        stage.appendChild(bar);

        const engine = new Engine(canvas, game.data?.objects || []);
        if (engine.errors.length) console.warn("Script issues:", engine.errors);

        // touch controls on phones/tablets, generated from the game's own keys
        if (isTouchDevice()) createTouchControls(engine, stage);
        bar.appendChild(fsBtn);
        attachFullscreenButton(fsBtn, stage);

        const hint = document.createElement("p");
        hint.className = "hint";
        hint.style.textAlign = "center";
        hint.textContent = isTouchDevice()
          ? "Tap the screen and buttons to play."
          : "Click the screen, then use your keyboard / mouse.";
        mount.appendChild(hint);

        engine.start();
      }
    };

    try {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) throw new Error("No game selected.");

      const game = await getGame(id);
      titleEl.textContent = game.title;
      metaEl.textContent = "by ";
      const ownerLink = document.createElement("a");
      ownerLink.href = "profile.html?u=" + encodeURIComponent(game.owner);
      ownerLink.textContent = game.owner;
      ownerLink.style.color = "#ff8f8c";
      metaEl.appendChild(ownerLink);
      metaEl.appendChild(document.createTextNode(
        ` · ${game.plays || 0} plays · published ${fmtDate(game.createdAt)}`));

      const render = renderers[game.engine] || renderers.v0;
      render(game, frame);
      countPlay(id);
    } catch (err) {
      titleEl.textContent = "Whoops";
      frame.textContent = err.message;
      toast(err.message, true);
    }
  </script>
</body>
</html>
