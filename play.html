<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Play</title>
  <meta name="description" content="Play a player-built game on RedlineStudio — one player per machine, get in line, watch and chat.">
  <link rel="canonical" href="https://redlinestudio.dev/play.html">
  <meta property="og:site_name" content="RedlineStudio">
  <meta property="og:title" content="Play — RedlineStudio">
  <meta property="og:description" content="Play a player-built game on RedlineStudio — one player per machine, get in line, watch and chat.">
  <meta property="og:url" content="https://redlinestudio.dev/play.html">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2208639648972390"
     crossorigin="anonymous"></script>
</head>
<body>
  <main class="page">
    <h1 class="page-title" id="game-title">Loading…</h1>
    <p class="page-sub" id="game-meta"></p>

    <!-- The game player. Each engine version keeps its renderer forever,
         so old games always work as the studio evolves. -->
    <div class="game-frame" id="frame"></div>
    <div id="game-floor" style="margin-top:14px"></div>
    <div id="game-scores" style="margin-top:14px"></div>
    <div id="game-votes" style="margin-top:14px"></div>
    <div id="game-comments" style="margin-top:10px"></div>
  </main>

  <script type="module">
    import { renderNav, toast, fmtDate, setNavCoins } from "./js/ui.js";
    import { getGame, countPlay } from "./js/games.js";
    import { Engine, drawFrame, CANVAS_W, CANVAS_H } from "./js/engine.js";
    import { createTouchControls, isTouchDevice } from "./js/touch-controls.js";
    import { attachFullscreenButton } from "./js/fullscreen.js";
    import { currentUser, auth } from "./js/auth.js";
    import { createLivePublisher, watchLive } from "./js/live.js";
    import { attachDuel, guestSlotOpen, duelAvailable } from "./js/duel.js";
    import { transferCoins, getCoins } from "./js/economy.js";
    import { renderVotes, renderComments } from "./js/social.js";
    import { attachTerminalInput } from "./js/terminal.js";
    import { attachCasinoLoop } from "./js/casino-odds.js";
    import { spinMachine, fundMachine, collectPool } from "./js/casino.js";
    import { createFloor, renderFloorPanel, seatTakenBy, isSeated, freeSlot, seatedPlayers, snapFromEngine, snapToObjects, clampHogMins, clampSeats } from "./js/floor.js";
    import { attachParty } from "./js/party.js";
    import { submitScore, renderScoreboard } from "./js/scores.js";
    import { sharpenCanvas, attachScreenSizeButton } from "./js/screen-size.js";

    renderNav("");

    const frame = document.getElementById("frame");
    const titleEl = document.getElementById("game-title");
    const metaEl = document.getElementById("game-meta");

    let floorCtl = null;   // the machine's seat (set once the game loads)
    let scoreCtl = null;   // the HIGH SCORES table (games with points + an end)
    const blockMsg = (b) => b.reason === "login" ? "Log in to play."
      : b.reason === "occupied" ? `${b.by} is playing this machine — get in line below.`
      : b.reason === "line" ? `There's a line — ${b.next} is up next. Get in line below.`
      : (b.message || "Couldn't take the seat.");

    const renderers = {
      // v0: the original "welcome message" games
      v0(game, mount) {
        const wrap = document.createElement("div");
        const msg = document.createElement("h2");
        msg.textContent = game.data?.message || "(This game has no content yet.)";
        const note = document.createElement("p");
        note.className = "hint";
        note.textContent = "Engine v0 — an early RedlineStudio game.";
        wrap.append(msg, note);
        mount.appendChild(wrap);
      },

      // v1 CASINO MACHINES: no coin gate — the BET is the price. The platform
      // runs the odds (see the Guide); the machine's script only does the show.
      casino(game, mount) {
        mount.innerHTML = "";
        mount.style.display = "block";

        const stage = document.createElement("div");
        stage.className = "stage";
        // the game's own world size (older games have none = the classic 480×360)
        const W = Number(game.data?.w) || CANVAS_W;
        const H = Number(game.data?.h) || CANVAS_H;
        const canvas = document.createElement("canvas");
        canvas.className = "workspace-canvas";
        sharpenCanvas(canvas, 2, W, H);  // double-resolution glass — crisp at any size
        stage.appendChild(canvas);
        mount.appendChild(stage);

        const bar = document.createElement("div");
        bar.className = "stage-bar";
        const szBtn = document.createElement("button");
        szBtn.className = "btn btn-small btn-ghost";
        const fsBtn = document.createElement("button");
        fsBtn.className = "btn btn-small btn-ghost";
        bar.append(szBtn, fsBtn);
        stage.appendChild(bar);
        attachScreenSizeButton(szBtn, stage);
        attachFullscreenButton(fsBtn, stage);

        const hint = document.createElement("p");
        hint.className = "hint";
        hint.style.textAlign = "center";
        mount.appendChild(hint);

        const me = currentUser();
        let cachedCoins = 0, cachedPool = Number(game.pool) || 0;
        let attract = null, engine = null, controls = null, term = null, loop = null;
        let gateBtn = null, liveUn = null;
        const livePub = createLivePublisher(game.id, me);   // 🔴 LIVE for the watchers

        function startAttract() {
          if (attract || engine) return;
          if (game.screen && game.screen.mode === "live" && game.screen.objects?.length) {
            attract = new Engine(canvas, game.screen.objects, { input: false, w: W, h: H });
            attract.start();
          } else if (game.screen && game.screen.mode !== "none" && game.screen.objects?.length) {
            drawFrame(canvas.getContext("2d"), game.screen.objects, { w: W, h: H });
          } else {
            drawFrame(canvas.getContext("2d"), [], { w: W, h: H });
          }
        }

        // the floor: an occupied machine locks the seat and opens the window
        if (floorCtl) floorCtl.onChange((data) => {
          const holder = seatTakenBy(data);
          const occupied = holder && holder !== me;
          // voted off: the machine takes itself back
          if (engine && me && data && data.player !== me) {
            engine.stop(); engine = null;
            livePub.stop();
            if (loop) { loop.destroy(); loop = null; }
            if (controls) { controls.destroy(); controls = null; }
            if (term) { term.destroy(); term = null; }
            floorCtl.stopBeating();
            toast("Your turn here ended — the line voted you off, or you sat down at another machine.", true);
            showSeatGate();
            startAttract();
            return;
          }
          if (gateBtn) {
            if (occupied) { gateBtn.disabled = true; gateBtn.textContent = `🕹 ${holder} IS PLAYING`; }
            else if (gateBtn.dataset.busy !== "1") { gateBtn.disabled = false; gateBtn.textContent = me ? "🎰 SIT DOWN" : "LOG IN TO PLAY"; }
          }
          if (!engine) {
            if (occupied) {
              if (!liveUn) liveUn = watchLive(game.id, (f) => {
                if (engine || !f) return;
                if (attract) { attract.stop(); attract = null; }
                drawFrame(canvas.getContext("2d"), snapToObjects(f), { terminal: f.term || [], w: W, h: H });
              });
              if (data.snap) {
                if (attract) { attract.stop(); attract = null; }
                drawFrame(canvas.getContext("2d"), snapToObjects(data.snap), { terminal: data.snap.term || [], w: W, h: H });
              }
            } else {
              if (liveUn) { liveUn(); liveUn = null; }
              startAttract();
            }
          } else if (liveUn) { liveUn(); liveUn = null; }
        });

        // the owner's till: load the machine, collect the take
        if (me === game.owner) {
          const till = document.createElement("div");
          till.className = "till-row";
          const amt = document.createElement("input");
          amt.type = "number"; amt.min = "1"; amt.placeholder = "amount"; amt.className = "till-amt";
          const fundBtn = document.createElement("button");
          fundBtn.className = "btn btn-small"; fundBtn.textContent = "Fund pool";
          const takeBtn = document.createElement("button");
          takeBtn.className = "btn btn-small btn-ghost"; takeBtn.textContent = "Collect";
          const poolLbl = document.createElement("span");
          poolLbl.className = "hint";
          const showPool = () => { poolLbl.textContent = ` pool: ◎ ${cachedPool}`; };
          showPool();
          const op = async (fn) => {
            try {
              const out = await fn(game.id, me, amt.value);
              cachedCoins = out.coins; cachedPool = out.pool;
              setNavCoins(out.coins); showPool();
              if (engine) { engine.vars.pool = cachedPool; engine.vars.coins = cachedCoins; }
              toast(`Pool is now ◎ ${out.pool}.`);
            } catch (err) { toast(err.message, true); }
          };
          fundBtn.addEventListener("click", () => op(fundMachine));
          takeBtn.addEventListener("click", () => op(collectPool));
          till.append(amt, fundBtn, takeBtn, poolLbl);
          mount.appendChild(till);
        }

        function sitDown() {
          if (attract) { attract.stop(); attract = null; }
          engine = new Engine(canvas, game.data?.objects || [], { w: W, h: H });
          if (engine.errors.length) console.warn("Script issues:", engine.errors);
          const wallet = {
            coins: () => cachedCoins,
            pool: () => cachedPool,
            async spin(bet) {
              const out = await spinMachine(game.id, me, bet);
              cachedCoins = out.coins; cachedPool = out.pool;
              setNavCoins(out.coins);
              return out;
            }
          };
          loop = attachCasinoLoop(engine, wallet, { real: true });
          if (isTouchDevice()) controls = createTouchControls(engine, stage);
          term = attachTerminalInput(engine, stage);
          engine.start();
          if (floorCtl) floorCtl.startBeating(() => engine ? snapFromEngine(engine) : null);
          livePub.start(() => engine ? snapFromEngine(engine) : null);
          if (liveUn) { liveUn(); liveUn = null; }
          if (me !== game.owner) countPlay(game.id);
          hint.textContent = "Real coins. The odds are the platform's — every machine returns 92% long-run. Bet 1–10.";
        }

        // attract behind the seat (a kick re-shows this gate)
        function showSeatGate() {
          startAttract();
          const overlay = document.createElement("div");
          overlay.className = "attract-overlay";
          const sitBtn = document.createElement("button");
          sitBtn.className = "coin-btn";
          sitBtn.textContent = me ? "🎰 SIT DOWN" : "LOG IN TO PLAY";
          overlay.appendChild(sitBtn);
          stage.appendChild(overlay);
          gateBtn = sitBtn;
          hint.textContent = `This machine holds ◎ ${cachedPool}. Bets go in, winnings come out — capped by the pool, like a real cabinet.`;
          sitBtn.addEventListener("click", async () => {
            if (!me) { window.location.href = "login.html"; return; }
            sitBtn.dataset.busy = "1";
            sitBtn.disabled = true;
            if (floorCtl) {
              const block = await floorCtl.sit();
              if (block) {
                toast(blockMsg(block), true);
                sitBtn.dataset.busy = "";
                return;   // the floor handler re-enables when the seat frees
              }
            }
            try { cachedCoins = await getCoins(me); } catch {}
            gateBtn = null;
            overlay.remove();
            sitDown();
          });
        }
        showSeatGate();
      },

      // v1: real scripted games on the CRT engine — with a real arcade front-end.
      // The platform runs the coin slot: the attract screen plays until you pay,
      // and if the game declares the play over (reserved var `endplay` = 1),
      // the coin slot comes back — the next play costs another coin. Games see
      // reserved var `arcade` = 1 so they can skip their own insert-coin screens.
      v1(game, mount) {
        mount.innerHTML = "";
        mount.style.display = "block";

        const stage = document.createElement("div");
        stage.className = "stage";
        // the game's own world size (older games have none = the classic 480×360)
        const W = Number(game.data?.w) || CANVAS_W;
        const H = Number(game.data?.h) || CANVAS_H;
        const canvas = document.createElement("canvas");
        canvas.className = "workspace-canvas";
        sharpenCanvas(canvas, 2, W, H);  // double-resolution glass — crisp at any size
        stage.appendChild(canvas);
        mount.appendChild(stage);

        const bar = document.createElement("div");
        bar.className = "stage-bar";
        const duelBtn = document.createElement("button");
        duelBtn.className = "btn btn-small";
        duelBtn.textContent = "⚔ DUEL";
        duelBtn.title = "Join the current player's game as the second human";
        duelBtn.style.display = "none";
        const szBtn = document.createElement("button");
        szBtn.className = "btn btn-small btn-ghost";
        const fsBtn = document.createElement("button");
        fsBtn.className = "btn btn-small btn-ghost";
        bar.append(duelBtn, szBtn, fsBtn);
        stage.appendChild(bar);
        attachScreenSizeButton(szBtn, stage);
        attachFullscreenButton(fsBtn, stage);

        const hint = document.createElement("p");
        hint.className = "hint";
        hint.style.textAlign = "center";
        mount.appendChild(hint);

        const me = currentUser();
        const price = me === game.owner ? 0 : (Number(game.price) || 0);
        const screen = game.screen;
        const hasScreen = screen && screen.mode !== "none" && screen.objects?.length > 0;

        // the live wire: fast frames out (playing) and in (watching),
        // and duels for games that speak the net contract
        const livePub = createLivePublisher(game.id, me);
        const duelable = (() => {
          try {
            const probe = new Engine(null, game.data?.objects || []);
            return typeof probe.usesDuel === "function" && probe.usesDuel();
          } catch { return false; }
        })();

        let attract = null, engine = null, controls = null, watcher = null, term = null;
        let gateBtn = null, gateLabel = "", gateOverlay = null;
        let liveUn = null, duelCtl = null, isDuelist = false;

        function startAttract() {
          if (attract || engine) return;
          if (hasScreen && screen.mode === "live") {
            attract = new Engine(canvas, screen.objects, { input: false, w: W, h: H });
            attract.start();
          } else if (hasScreen) {
            drawFrame(canvas.getContext("2d"), screen.objects, { w: W, h: H });
          } else {
            drawFrame(canvas.getContext("2d"), [], { w: W, h: H });
          }
        }

        const seats = clampSeats(game.seats);

        // the floor: N seats per cabinet; everyone not seated watches the window
        if (floorCtl) floorCtl.onChange((data) => {
          const holder = seatTakenBy(data);
          const meSeated = me && isSeated(data, me);
          const isFull = freeSlot(data, Date.now(), seats) === 0;
          const nSeated = seatedPlayers(data).length;
          const occupied = holder && !meSeated;   // someone's playing and it isn't me
          // voted off (or seat lost): the machine takes the game back
          // (a duelist never held the seat, so seat changes don't end them)
          if (engine && me && !isDuelist && data && !meSeated) {
            if (watcher) { clearInterval(watcher); watcher = null; }
            engine.stop(); engine = null;
            livePub.stop();
            if (duelCtl) { duelCtl.destroy(); duelCtl = null; }
            if (controls) { controls.destroy(); controls = null; }
            if (term) { term.destroy(); term = null; }
            floorCtl.stopBeating();
            toast("Your turn here ended — the line voted you off, or you sat down at another machine.", true);
            showGate(true);
            return;
          }
          if (gateBtn) {
            if (isFull && !meSeated) {
              gateBtn.disabled = true;
              gateBtn.textContent = seats > 1 ? `🕹 FULL — ${nSeated}/${seats} PLAYING` : `🕹 ${holder} IS PLAYING`;
            } else if (gateBtn.dataset.busy !== "1") {
              gateBtn.disabled = false;
              gateBtn.textContent = (seats > 1 && nSeated > 0 && !meSeated)
                ? `${gateLabel} — JOIN ${nSeated}/${seats}`
                : gateLabel;
            }
          }
          // guest duels are the 1-seat machines' trick; multi-seat games
          // just have more seats — sit down instead
          duelBtn.style.display =
            (seats === 1 && duelable && duelAvailable() && me && occupied && !engine) ? "" : "none";
          if (!engine) {
            if (occupied) {
              // 🔴 LIVE: the fast feed, with the slow snapshot as fallback
              if (!liveUn) liveUn = watchLive(game.id, (f) => {
                if (engine || !f) return;
                if (attract) { attract.stop(); attract = null; }
                drawFrame(canvas.getContext("2d"), snapToObjects(f), { terminal: f.term || [], w: W, h: H });
              });
              if (data.snap) {
                if (attract) { attract.stop(); attract = null; }
                drawFrame(canvas.getContext("2d"), snapToObjects(data.snap), { terminal: data.snap.term || [], w: W, h: H });
              }
            } else {
              if (liveUn) { liveUn(); liveUn = null; }
              startAttract();
            }
          } else if (liveUn) { liveUn(); liveUn = null; }
        });

        // the arcade contract: endplay = 1 means this play is spent
        // (shared by the seat holder and a duel challenger)
        function startEndWatcher() {
          watcher = setInterval(() => {
            if (engine && Number(engine.vars.endplay) === 1) {
              const finalScore = Math.floor(Number(engine.vars.score) || 0);
              const wasDuelist = isDuelist;
              clearInterval(watcher); watcher = null;
              engine.stop(); engine = null;
              livePub.stop();
              if (duelCtl) { duelCtl.destroy(); duelCtl = null; }
              isDuelist = false;
              duelBtn.disabled = false;
              if (controls) { controls.destroy(); controls = null; }
              if (term) { term.destroy(); term = null; }
              showGate(true);
              // the HIGH SCORES table: a finished play posts your best
              if (scoreCtl && me && finalScore > 0) {
                submitScore(game.id, me, finalScore).then((r) => {
                  if (r?.improved) toast(`★ New personal best: ${finalScore}`);
                  scoreCtl.refresh();
                }).catch(() => {});
              }
              // arcade etiquette: play's over and people are waiting →
              // back of the line (no line = keep your seat, play again)
              if (!wasDuelist && floorCtl && floorCtl.line().length > 0) {
                floorCtl.rotateToBack().then((rotated) => {
                  if (rotated) toast("Play over — people are waiting, so you're at the back of the line.");
                  else floorCtl.startBeating(() => engine ? snapFromEngine(engine) : null);
                });
              }
            }
          }, 300);
        }

        function startGame() {
          if (attract) { attract.stop(); attract = null; }
          if (liveUn) { liveUn(); liveUn = null; }
          engine = new Engine(canvas, game.data?.objects || [], { w: W, h: H });
          engine.vars.arcade = 1;   // the coin door is handled out here
          if (engine.errors.length) console.warn("Script issues:", engine.errors);
          if (isTouchDevice()) controls = createTouchControls(engine, stage);
          term = attachTerminalInput(engine, stage);   // text adventures get their keyboard
          engine.start();
          if (floorCtl) floorCtl.startBeating(() => engine ? snapFromEngine(engine) : null);
          // 🔴 LIVE for the watchers — the cabinet shows the PRIMARY's screen
          livePub.start(() => {
            if (!engine) return null;
            const prim = floorCtl && floorCtl.primary();
            if (prim && prim !== me) return null;
            return snapFromEngine(engine);
          });
          if (duelable && me) {
            if (seats > 1) {
              duelCtl = attachParty(engine, game.id, me, auth.currentUser?.uid,
                (floorCtl && floorCtl.mySlot()) || 1, seats);
            } else {
              attachDuel(engine, game.id, me, auth.currentUser?.uid, "host")
                .then((c) => { duelCtl = c; }).catch(() => {});
            }
          }
          if (me !== game.owner) countPlay(game.id);   // your own plays don't count
          hint.textContent = isTouchDevice()
            ? "Tap the screen and buttons to play."
            : "Click the screen, then use your keyboard / mouse.";
          startEndWatcher();
        }

        // ⚔ the challenger's door: join the current player's game as player 2
        async function startDuel() {
          if (!me) { window.location.href = "login.html"; return; }
          duelBtn.disabled = true;
          try {
            if (!(await guestSlotOpen(game.id, me))) {
              toast("Someone's already challenging — get in line for the seat instead.", true);
              duelBtn.disabled = false;
              return;
            }
            const eng2 = new Engine(canvas, game.data?.objects || [], { w: W, h: H });
            eng2.vars.arcade = 1;
            const ctl = await attachDuel(eng2, game.id, me, auth.currentUser?.uid, "guest");
            if (price > 0) {
              try {
                await transferCoins(me, game.owner, price);
                getCoins(me).then(setNavCoins).catch(() => {});
              } catch (err) {
                toast(err.message, true);
                if (ctl) ctl.destroy();
                duelBtn.disabled = false;
                return;
              }
            }
            if (attract) { attract.stop(); attract = null; }
            if (liveUn) { liveUn(); liveUn = null; }
            if (gateOverlay) { gateOverlay.remove(); gateOverlay = null; gateBtn = null; }
            engine = eng2;
            duelCtl = ctl;
            isDuelist = true;
            if (engine.errors.length) console.warn("Script issues:", engine.errors);
            if (isTouchDevice()) controls = createTouchControls(engine, stage);
            term = attachTerminalInput(engine, stage);
            engine.start();
            if (me !== game.owner) countPlay(game.id);
            duelBtn.style.display = "none";
            hint.textContent = "⚔ DUEL — you're the challenger. The machine's player is the other eyeball.";
            startEndWatcher();
          } catch (err) {
            toast(err.message, true);
            duelBtn.disabled = false;
          }
        }
        duelBtn.addEventListener("click", startDuel);

        function showGate(again) {
          // attract mode behind the coin slot (live, but deaf)
          startAttract();

          const overlay = document.createElement("div");
          overlay.className = "attract-overlay";
          const playBtn = document.createElement("button");
          playBtn.className = "coin-btn";
          gateLabel = price > 0
            ? `◎ INSERT ${price} — PLAY${again ? " AGAIN" : ""}`
            : (again ? "▶ PLAY AGAIN" : "▶ PLAY");
          playBtn.textContent = gateLabel;
          overlay.appendChild(playBtn);
          stage.appendChild(overlay);
          gateOverlay = overlay;
          gateBtn = playBtn;
          hint.textContent = price > 0
            ? `This is a coin game — ${price} coins per play. Earn coins on the Market page.`
            : "";

          playBtn.addEventListener("click", async () => {
            playBtn.dataset.busy = "1";
            playBtn.disabled = true;
            // the seat first — nobody pays for an occupied machine
            if (floorCtl && me) {
              const block = await floorCtl.sit();
              if (block) {
                toast(blockMsg(block), true);
                playBtn.dataset.busy = "";
                playBtn.disabled = false;
                return;
              }
            }
            if (price > 0) {
              if (!me) { window.location.href = "login.html"; return; }
              try {
                await transferCoins(me, game.owner, price);
                getCoins(me).then(setNavCoins).catch(() => {});
              } catch (err) {
                toast(err.message, true);
                playBtn.dataset.busy = "";
                playBtn.disabled = false;
                return;
              }
            }
            gateBtn = null;
            overlay.remove();
            gateOverlay = null;
            startGame();
          });
        }

        if (!hasScreen && price === 0) startGame();
        else showGate(false);
      }
    };

    try {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) throw new Error("No game selected.");

      const game = await getGame(id);
      titleEl.textContent = game.title;
      document.title = `${game.title} by ${game.owner} — RedlineStudio`;
      metaEl.textContent = "by ";
      const ownerLink = document.createElement("a");
      ownerLink.href = "profile.html?u=" + encodeURIComponent(game.owner);
      ownerLink.textContent = game.owner;
      ownerLink.style.color = "#ff8f8c";
      metaEl.appendChild(ownerLink);
      metaEl.appendChild(document.createTextNode(
        ` · ${game.plays || 0} plays · published ${fmtDate(game.createdAt)}` +
        (Number(game.price) > 0 ? ` · ◎ ${game.price} per play` : "") +
        (game.casino ? ` · 🎰 pool ◎ ${Number(game.pool) || 0}` : "") +
        (game.engine === "v1" || game.casino ? ` · ⏳ line patience: ${clampHogMins(game.hogmins)} min` : "") +
        (clampSeats(game.seats) > 1 && !game.casino ? ` · 👥 ${clampSeats(game.seats)} seats` : "")));
      if (game.description) {
        const d = document.createElement("p");
        d.className = "page-sub";
        d.style.marginTop = "4px";
        d.textContent = game.description;
        metaEl.after(d);
      }

      if (game.engine === "v1" || game.casino) {
        floorCtl = createFloor(id, currentUser(), { hogMs: clampHogMins(game.hogmins) * 60000, seats: clampSeats(game.casino ? 1 : game.seats) });
        renderFloorPanel(document.getElementById("game-floor"), floorCtl, currentUser());
        window.addEventListener("pagehide", () => floorCtl.leaveBeacon());
      }

      // HIGH SCORES: any game with points and a real end gets the table.
      // (Defensive: never let the leaderboard probe take down the machine —
      // e.g. a stale cached engine.js without usesScoreboard yet.)
      try {
        const probe = new Engine(null, game.data?.objects || []);
        if (game.engine === "v1" && !game.casino
            && typeof probe.usesScoreboard === "function" && probe.usesScoreboard()) {
          scoreCtl = renderScoreboard(document.getElementById("game-scores"), id, currentUser());
        }
      } catch (err) { console.warn("scoreboard probe:", err); }

      const render = game.casino ? renderers.casino : (renderers[game.engine] || renderers.v0);
      render(game, frame);
      if (game.engine !== "v1" && currentUser() !== game.owner) countPlay(id);   // v1 counts when the game actually starts

      renderVotes(document.getElementById("game-votes"), "games", id, game, currentUser());
      renderComments(document.getElementById("game-comments"), "games", id, currentUser());
    } catch (err) {
      titleEl.textContent = "Whoops";
      frame.textContent = err.message;
      toast(err.message, true);
    }
  </script>
  <script type="module">import { footAd } from "./js/ads.js"; footAd();</script>
</body>
</html>
