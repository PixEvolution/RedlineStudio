<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedlineStudio — Players</title>
  <meta name="description" content="Every player on RedlineStudio — their games, custom profile pages, ratings and total plays.">
  <link rel="canonical" href="https://redlinestudio.dev/profiles.html">
  <meta property="og:site_name" content="RedlineStudio">
  <meta property="og:title" content="RedlineStudio Players">
  <meta property="og:description" content="Every player on RedlineStudio — their games, custom profile pages, ratings and total plays.">
  <meta property="og:url" content="https://redlinestudio.dev/profiles.html">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <h1 class="page-title">Players</h1>
    <p class="page-sub">Everyone on the platform. Click a name to visit their page.</p>
    <div id="filter-mount"></div>
    <div id="players" class="games-grid">
      <p class="empty-note">Loading players…</p>
    </div>
  </main>

  <script type="module">
    import { renderNav, toast, fmtDate } from "./js/ui.js";
    import { listUsers } from "./js/profiles.js";
    import { listGames } from "./js/games.js";
    import { createFilterBar, applyFilter } from "./js/filterbar.js";

    renderNav("");
    const grid = document.getElementById("players");

    try {
      const [users, games] = await Promise.all([listUsers(), listGames()]);

      // a player's plays = every play of every game they published
      const playsBy = {};
      for (const g of games) playsBy[g.owner] = (playsBy[g.owner] || 0) + (Number(g.plays) || 0);
      for (const u of users) u.plays = playsBy[u.username] || 0;

      const render = (search, sort) => {
        grid.innerHTML = "";
        const shown = applyFilter(users, search, sort, ["username"]);
        if (shown.length === 0) {
          grid.innerHTML = users.length === 0
            ? `<p class="empty-note">No players yet.</p>`
            : `<p class="empty-note">No players match that search.</p>`;
          return;
        }
        for (const u of shown) {
          const card = document.createElement("a");
          card.className = "game-card";
          card.href = "profile.html?u=" + encodeURIComponent(u.username);
          const name = document.createElement("div");
          name.className = "game-title";
          name.textContent = u.username;
          name.title = u.username;
          const meta = document.createElement("div");
          meta.className = "game-meta";
          meta.textContent = `joined ${fmtDate(u.createdAt) || "recently"} · ${u.plays} plays · ▲ ${u.likes} ▼ ${u.dislikes}`;
          card.append(name, meta);
          grid.appendChild(card);
        }
      };

      createFilterBar(document.getElementById("filter-mount"), {
        placeholder: "Search players…",
        sorts: [
          ["rated", "Top rated"],
          ["recent", "Most recent"],
          ["played", "Most plays"]
        ],
        onChange: render
      });
      render("", "rated");
    } catch (err) {
      grid.innerHTML = "";
      toast("Couldn't load players: " + err.message, true);
    }
  </script>
  <script type="module">import { footAd } from "./js/ads.js"; footAd();</script>
</body>
</html>
